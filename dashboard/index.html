<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travindex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f14;
        --surface: #131a22;
        --raised: #1a232d;
        --line: #26313d;
        --line-soft: #1f2832;
        --line-hover: #3a4757;
        --ink: #e8edf2;
        --ink-2: #c9d3de;
        --muted: #93a0ad;
        --faint: #6b7784;
        --accent: #7fa6ff;
        --link: #9db9ff;
        --link-hover: #c4d5ff;
        --on-light: #0b0f14;
        --sub-on-light: #3a4654;
        --val-soft: #1b2a4d;
        --val-strong: #3d6bff;
        --row-strong: #162038;
        --warn: #e3ad55;
        --warn-soft: #3a2f1c;
        --font:
          "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 15px/1.45 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--link);
      }
      a:hover {
        color: var(--link-hover);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .cond {
        font-family: var(--font-cond);
      }
      .label {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .chip {
        font-size: 14px;
        padding: 5px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        color: var(--ink-2);
      }
      .chip.warn {
        border-color: transparent;
        background: var(--warn-soft);
        color: var(--warn);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--line-hover);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: progress;
      }
      .btn.icon {
        width: 44px;
        padding: 0;
      }
      .badge-leg {
        font: 700 15px/1.2 var(--font-cond);
        padding: 3px 9px;
        border-radius: 7px;
        background: var(--accent);
        color: var(--on-light);
      }
      .val {
        justify-self: end;
        font: 700 17px/1.3 var(--font-cond);
        padding: 1px 7px;
        border-radius: 7px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .val.pos {
        background: var(--val-soft);
        color: var(--link);
      }
      .val.strong {
        background: var(--val-strong);
        color: #fff;
      }
      .nr {
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 7px;
        border: 1.5px solid var(--muted);
        font: 700 16px/1 var(--font-cond);
      }

      /* ---------- Topbar ---------- */
      .top {
        border-bottom: 1px solid var(--line-soft);
      }
      .top .wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
        padding-top: 14px;
        padding-bottom: 14px;
      }
      .brand-group {
        display: flex;
        align-items: center;
        gap: 32px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        text-decoration: none;
        font: 700 24px/1 var(--font-cond);
        letter-spacing: 0.02em;
      }
      .brand:hover {
        color: var(--ink);
      }
      .mainnav a {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 10px;
        color: var(--ink-2);
        text-decoration: none;
        font-weight: 500;
      }
      .mainnav a[aria-current="page"] {
        background: var(--raised);
        color: var(--ink);
        font-weight: 600;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .field:focus-within {
        border-color: var(--line-hover);
      }
      .field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-size: 15px;
      }
      .field input[type="date"] {
        color-scheme: dark;
        width: 136px;
      }
      .search {
        position: relative;
        min-width: 280px;
      }
      .search .field {
        width: 100%;
      }
      .results {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        margin: 0;
        padding: 6px;
        list-style: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.45);
        max-height: 60vh;
        overflow-y: auto;
      }
      .results button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        padding: 6px 10px;
        border-radius: 10px;
        cursor: pointer;
      }
      .results button:hover,
      .results button:focus-visible {
        background: var(--raised);
        outline: none;
      }
      .results .rs-name {
        font: 600 18px/1.15 var(--font-cond);
      }
      .results .rs-meta {
        font-size: 13px;
        color: var(--muted);
      }
      .results .empty-hit {
        padding: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .statusline {
        min-height: 20px;
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--muted);
        text-align: right;
      }
      .statusline.error {
        color: var(--warn);
        font-weight: 600;
      }

      /* ---------- Dagens spel ---------- */
      .page {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding-top: 14px;
        padding-bottom: 48px;
      }
      .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .page-head .eyebrow {
        display: block;
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 500;
        color: var(--muted);
      }
      h1 {
        margin: 0;
        font: 700 52px/1 var(--font-cond);
      }
      .page-meta {
        font-size: 15px;
        color: var(--muted);
      }
      .today {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .games {
        flex: 1 1 260px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .game-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .game-btn {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 68px;
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--surface);
        text-align: left;
        cursor: pointer;
      }
      .game-btn:hover {
        border-color: var(--line-hover);
      }
      .game-btn[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--on-light);
      }
      .game-btn .g-id {
        font: 700 26px/1 var(--font-cond);
        min-width: 52px;
      }
      .game-btn .g-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .game-btn .g-tracks {
        font-size: 15px;
        font-weight: 600;
      }
      .game-btn .g-meta {
        font-size: 13px;
        color: var(--muted);
      }
      .game-btn[aria-pressed="true"] .g-meta {
        color: var(--sub-on-light);
      }
      .game-btn .g-time {
        font: 600 18px/1 var(--font-cond);
        font-variant-numeric: tabular-nums;
      }
      .today-main {
        flex: 999 1 560px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .sel {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px;
      }
      .sel-id {
        display: flex;
        align-items: center;
        gap: 20px;
        min-width: 0;
      }
      .sel-id .big {
        font: 700 56px/1 var(--font-cond);
        color: var(--accent);
      }
      .sel-id .s-tracks {
        display: block;
        font-size: 18px;
        font-weight: 600;
      }
      .sel-id .s-meta {
        display: block;
        font-size: 14px;
        color: var(--muted);
      }
      .stats {
        display: flex;
        gap: 32px;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .stat .v {
        font: 700 30px/1 var(--font-cond);
        font-variant-numeric: tabular-nums;
      }
      .stat .v.blue {
        color: var(--link);
      }

      .track {
        overflow: hidden;
      }
      .track-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
      }
      .track-head .t-title {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 12px;
        min-width: 0;
      }
      .track-head h2 {
        margin: 0;
        font: 700 28px/1 var(--font-cond);
      }
      .track-head .t-sum {
        font-size: 14px;
        color: var(--muted);
      }
      .status-pill {
        flex: none;
        font-size: 13px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 8px;
        background: var(--val-soft);
        color: var(--link);
      }
      .status-pill.done {
        background: var(--raised);
        color: var(--muted);
      }
      .legs {
        overflow-x: auto;
        border-top: 1px solid var(--line);
      }
      .legs-inner {
        min-width: 820px;
      }
      .leg-head,
      .leg-row {
        display: grid;
        grid-template-columns:
          80px 70px 80px minmax(0, 1.1fr) 70px minmax(0, 1.4fr)
          minmax(0, 1.4fr) 28px;
        gap: 12px;
        align-items: center;
        padding: 10px 20px;
      }
      .leg-head {
        background: var(--raised);
      }
      .leg-row {
        min-height: 60px;
        padding-top: 8px;
        padding-bottom: 8px;
        border-top: 1px solid var(--line-soft);
        color: var(--ink);
        text-decoration: none;
      }
      .leg-row:hover {
        background: var(--raised);
        color: var(--ink);
      }
      .leg-row.past {
        opacity: 0.72;
      }
      .leg-row .r-main,
      .leg-row .r-line {
        display: contents;
      }
      .leg-row .leg {
        grid-column: 1;
        justify-self: start;
        font: 700 16px/1.2 var(--font-cond);
        padding: 4px 9px;
        border-radius: 8px;
        background: var(--raised);
        border: 1px solid var(--line);
        color: var(--accent);
        white-space: nowrap;
      }
      .leg-row .r-no {
        grid-column: 2;
        grid-row: 1;
        font-size: 15px;
        color: var(--ink-2);
      }
      .leg-row .r-time {
        grid-column: 3;
        grid-row: 1;
        font: 600 20px/1 var(--font-cond);
        font-variant-numeric: tabular-nums;
      }
      .leg-row .r-meta {
        grid-column: 4;
        font-size: 14px;
        color: var(--ink-2);
      }
      .leg-row .r-starters {
        grid-column: 5;
        text-align: right;
        font: 600 18px/1 var(--font-cond);
        font-variant-numeric: tabular-nums;
      }
      .leg-row .r-pick {
        grid-column: 6;
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .r-pick .r-pickname,
      .r-val .r-valname {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .r-val .r-valname {
        font-weight: 400;
      }
      .r-pick .r-note {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .leg-row .r-val {
        grid-column: 7;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .r-val .val {
        font-size: 15px;
        padding: 1px 6px;
        border-radius: 6px;
      }
      .leg-row .chev {
        grid-column: 8;
        color: var(--faint);
      }

      /* ---------- Loppvy ---------- */
      .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .crumbs a {
        color: var(--ink-2);
        text-decoration: none;
        font-weight: 600;
      }
      .crumbs .here {
        color: var(--ink);
      }
      .back {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
        color: var(--ink-2);
        text-decoration: none;
        font-weight: 600;
      }
      .race-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }
      .race-head .rh-left {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .race-head .rh-tag {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .race-head .rh-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .race-head .rh-time {
        font: 700 44px/1 var(--font-cond);
        font-variant-numeric: tabular-nums;
      }
      .race-head .rh-count {
        font-size: 14px;
        color: var(--muted);
      }
      .race-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .race-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        min-width: 84px;
        height: 56px;
        padding: 0 8px;
        border-radius: 12px;
        text-decoration: none;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .race-tab:hover {
        border-color: var(--line-hover);
        color: var(--ink);
      }
      .race-tab .t-no {
        font: 700 18px/1 var(--font-cond);
      }
      .race-tab .t-sub {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .race-tab[aria-current="page"] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--on-light);
      }
      .race-tab[aria-current="page"] .t-sub {
        color: var(--sub-on-light);
      }
      .race-tab.past:not([aria-current="page"]) {
        opacity: 0.72;
      }
      .race-body {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .ranking {
        flex: 999 1 640px;
        min-width: 0;
        overflow: hidden;
      }
      .ranking-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
      }
      .ranking-head h2 {
        margin: 0;
        font: 700 24px/1.2 var(--font-cond);
      }
      .sort {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .seg button {
        height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink-2);
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--on-light);
        font-weight: 700;
      }
      .table-box {
        overflow-x: auto;
        border-top: 1px solid var(--line);
      }
      .runners {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }
      .runners th {
        padding: 10px 6px;
        background: var(--raised);
        text-align: left;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .runners td {
        padding: 6px;
        border-top: 1px solid var(--line-soft);
        vertical-align: middle;
      }
      .runners th:first-child,
      .runners td:first-child {
        padding-left: 20px;
      }
      .runners th:last-child,
      .runners td:last-child {
        padding-right: 20px;
      }
      .runners .right {
        text-align: right;
      }
      .runners .center {
        text-align: center;
      }
      tr.runner {
        height: 58px;
      }
      tr.runner.strong td {
        background: var(--row-strong);
      }
      tr.runner.flash td {
        animation: flash 1.6s ease-out;
      }
      @keyframes flash {
        from {
          background: #2a3b63;
        }
      }
      .c-rank {
        width: 52px;
      }
      .c-nr {
        width: 52px;
      }
      .rank {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font: 700 18px/1 var(--font-cond);
      }
      .rank.r1 {
        background: var(--ink);
        color: var(--on-light);
      }
      .rank.r2 {
        background: var(--line);
      }
      .horse-cell {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .toggle {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0 10px;
        min-width: 0;
        min-height: 44px;
        align-content: center;
        border-radius: 4px;
      }
      .toggle:focus-visible {
        outline: 2px solid var(--link);
      }
      .h-name {
        font: 600 20px/1.15 var(--font-cond);
      }
      .h-name::after {
        content: "\00a0+";
        color: var(--faint);
        font-weight: 500;
      }
      .toggle[aria-expanded="true"] .h-name::after {
        content: "\00a0−";
      }
      .h-driver {
        font-size: 13px;
        color: var(--muted);
      }
      .low .h-name,
      .low .pts-n {
        color: var(--ink-2);
      }
      .c-pts {
        width: 24%;
      }
      .pts {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pts-n {
        min-width: 40px;
        font: 700 20px/1 var(--font-cond);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        flex: 1;
        display: block;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--ink-2);
      }
      .c-win {
        font: 600 20px/1 var(--font-cond);
      }
      .c-odds {
        font-size: 15px;
        color: var(--ink-2);
      }
      .c-val {
        width: 100px;
      }
      .odds-inline {
        display: block;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

    <script>
      const FACTORS = [
        ["form", "Form"],
        ["speed", "Fart"],
        ["class", "Klass"],
        ["winRate", "Segerprocent"],
        ["driver", "Kusk"],
        ["trainer", "Tränare"],
        ["position", "Spår/distans"],
        ["gearForm", "Rustningsform"],
        ["gearChange", "Ny utrustning"],
        ["freshness", "Vila"],
        ["market", "Marknad"],
      ];
      /** Spelvärde (modell/marknad) från vilket etiketten fylls i. */
      const GOOD_VALUE = 1.15;
      const LOW_CONFIDENCE = 0.6;
      const SORTS = [
        ["points", "Poäng"],
        ["value", "Värde"],
        ["number", "Startnr"],
      ];

      const $ = (id) => document.getElementById(id);
      const els = {
        date: $("date"),
        refresh: $("refresh"),
        exportPdf: $("export"),
        status: $("status"),
        view: $("view"),
        q: $("q"),
        results: $("q-results"),
        search: $("search"),
        searchToggle: $("search-toggle"),
      };
      const state = {
        date: null,
        games: [],
        gameId: null,
        /** Senast hämtade ranking per spel-id. */
        rankings: new Map(),
        loading: false,
        error: null,
        /** Avdelning 1..n när loppvyn visas, annars null. */
        leg: null,
        sort: "points",
        open: new Set(),
        highlight: null,
        source: null,
      };

      const todayStockholm = () =>
        new Date().toLocaleDateString("sv-SE", {
          timeZone: "Europe/Stockholm",
        });
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const nf = (n, d) =>
        n.toLocaleString("sv-SE", {
          minimumFractionDigits: d,
          maximumFractionDigits: d,
        });
      const hhmm = (iso) => (iso && iso.length >= 16 ? iso.slice(11, 16) : "");
      const startMethod = (m) =>
        m === "auto" ? "Autostart" : m === "volte" ? "Voltstart" : "";
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
      const longDate = (d) =>
        cap(
          new Date(`${d}T12:00:00`).toLocaleDateString("sv-SE", {
            weekday: "long",
            day: "numeric",
            month: "long",
          }),
        );

      const game = () => state.rankings.get(state.gameId) ?? null;
      const summary = () => state.games.find((g) => g.id === state.gameId);
      const legLabel = (g, i) => `${g.gameType}-${i + 1}`;
      const started = (race) => {
        const today = todayStockholm();
        if (state.date < today) return true;
        if (state.date > today || !race.startTime) return false;
        return Date.parse(race.startTime) <= Date.now();
      };
      const valuePct = (v) => Math.round((v - 1) * 100);
      function valueBadge(v, cls = "val") {
        if (v == null) return `<span class="${cls}">–</span>`;
        const p = valuePct(v);
        const kind = v >= GOOD_VALUE ? " strong" : p > 0 ? " pos" : "";
        const text = `${p > 0 ? "+" : p < 0 ? "−" : ""}${Math.abs(p)}%`;
        return `<span class="${cls}${kind}">${text}</span>`;
      }
      const winPct = (p) => {
        const x = p * 100;
        if (x < 0.5) return "&lt;1%";
        return `${x < 10 ? nf(x, 1) : Math.round(x)}%`;
      };
      const bestValue = (race) =>
        race.runners
          .filter((r) => r.value != null)
          .sort((a, b) => b.value - a.value)[0] ?? null;

      function countdown(race) {
        if (!race.startTime) return "";
        const today = todayStockholm();
        if (state.date !== today) return longDate(state.date);
        const min = Math.round((Date.parse(race.startTime) - Date.now()) / 60000);
        if (min <= 0) return "Startat";
        const h = Math.floor(min / 60);
        return `Start om ${h ? `${h} h ` : ""}${min % 60} min`;
      }

      function setStatus(text, isError = false) {
        els.status.textContent = text;
        els.status.classList.toggle("error", isError);
        els.status.setAttribute("role", isError ? "alert" : "status");
      }

      /* ---------- URL och navigering ---------- */
      function urlFor(leg) {
        const p = new URLSearchParams({ date: state.date });
        if (state.gameId) p.set("game", state.gameId);
        if (leg) p.set("lopp", String(leg));
        return `?${p}`;
      }
      function go(leg, { push = true } = {}) {
        state.leg = leg;
        if (push) history.pushState(null, "", urlFor(leg));
        else history.replaceState(null, "", urlFor(leg));
        render();
        if (state.highlight == null) scrollTo({ top: 0 });
      }

      /* ---------- Spel ---------- */
      async function loadGames(preferredId) {
        state.games = [];
        state.error = null;
        state.loading = true;
        render();
        setStatus("Hämtar spel …");
        try {
          const res = await fetch(`/api/games?date=${state.date}`);
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
          state.games = body;
          if (!body.length) {
            state.gameId = null;
            state.leg = null;
            state.loading = false;
            history.replaceState(null, "", urlFor(null));
            setStatus("");
            return render();
          }
          if (!body.some((g) => g.id === preferredId)) state.leg = null;
          state.gameId = body.some((g) => g.id === preferredId)
            ? preferredId
            : body[0].id;
          history.replaceState(null, "", urlFor(state.leg));
          loadRanking(false);
        } catch (err) {
          state.loading = false;
          state.error = {
            title: "Kunde inte hämta spelen",
            text: `${err.message}. Kontrollera att servern körs och tryck Uppdatera.`,
          };
          setStatus("");
          render();
        }
      }

      /* ---------- Ranking (server-sent events med förlopp) ---------- */
      function loadRanking(fresh) {
        if (!state.gameId) return;
        state.source?.close();
        const gameId = state.gameId;
        const hasData = state.rankings.has(gameId);
        state.loading = true;
        state.error = null;
        document.body.classList.toggle("refreshing", hasData);
        els.refresh.disabled = true;
        els.exportPdf.disabled = true;
        render();
        setStatus("Hämtar startlistor …");

        const es = new EventSource(
          `/api/rankings?date=${state.date}&game=${encodeURIComponent(gameId)}${fresh ? "&fresh=1" : ""}`,
        );
        state.source = es;
        const done = () => {
          es.close();
          if (state.source === es) state.source = null;
          state.loading = false;
          els.refresh.disabled = false;
          document.body.classList.remove("refreshing");
        };
        es.addEventListener("log", (e) =>
          setStatus(JSON.parse(e.data).replace(/^ATG: |^Topplista /, "")),
        );
        es.addEventListener("result", (e) => {
          const data = JSON.parse(e.data);
          done();
          state.rankings.set(gameId, data);
          if (state.leg && state.leg > data.races.length) state.leg = null;
          render();
          setStatus(
            `Uppdaterad ${new Date(data.computedAt).toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" })}`,
          );
        });
        es.addEventListener("error", (e) => {
          const message = e.data
            ? JSON.parse(e.data).message
            : "Anslutningen till servern bröts";
          done();
          if (hasData) setStatus(`Kunde inte uppdatera: ${message}`, true);
          else {
            state.error = {
              title: "Kunde inte räkna fram rankingen",
              text: `${message}. Tryck Uppdatera för att försöka igen.`,
            };
            setStatus("");
          }
          render();
        });
      }

      /* ---------- Rendering ---------- */
      function render() {
        const g = game();
        els.exportPdf.disabled = state.loading || !g?.races.length;
        if (state.leg) $("nav-today").removeAttribute("aria-current");
        else $("nav-today").setAttribute("aria-current", "page");
        if (state.leg && g?.races[state.leg - 1]) renderRace(g);
        else renderToday(g);
        closeResults();
      }

      function emptyHtml(title, text) {
        return `<div class="card empty"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
      }

      function renderToday(g) {
        const isToday = state.date === todayStockholm();
        const trackCount = new Set(state.games.flatMap((x) => x.tracks)).size;
        const head = `<div class="page-head">
      <div><span class="eyebrow">${esc(longDate(state.date))}</span><h1>${isToday ? "Dagens spel" : "Spel"}</h1></div>
      ${state.games.length ? `<span class="page-meta">${plural(trackCount, "bana", "banor")} · ${state.games.length} spel · rankingen uppdateras när oddsen rör sig</span>` : ""}
    </div>`;

        let body;
        if (state.error && !state.games.length) body = emptyHtml(state.error.title, state.error.text);
        else if (!state.games.length && state.loading)
          body = '<div class="skeleton"></div>';
        else if (!state.games.length)
          body = emptyHtml(
            "Inga spel den här dagen",
            "ATG har inga spel med flera lopp det här datumet. Välj ett annat datum.",
          );
        else
          body = `<div class="today">
      <aside class="games">
        <h2 class="label sr-m" id="games-label">Välj spel</h2>
        <div role="group" aria-labelledby="games-label" class="game-list">${state.games.map(gameBtnHtml).join("")}</div>
      </aside>
      <div class="today-main">${selectedHtml(g)}${tracksHtml(g)}</div>
    </div>`;

        els.view.innerHTML = `<div class="wrap page">${head}${body}</div>`;
      }

      function gameBtnHtml(s) {
        const on = s.id === state.gameId;
        const r = state.rankings.get(s.id);
        const done = r && r.races.length && r.races.every(started);
        const meta = r
          ? plural(r.races.length, "avdelning", "avdelningar") +
            (done ? " · avgjort" : "")
          : "";
        return `<button type="button" class="game-btn" data-game="${esc(s.id)}" aria-pressed="${on}">
      <span class="g-id">${esc(s.type)}</span>
      <span class="g-text"><span class="g-tracks">${esc(s.tracks.join(" + "))}</span>${meta ? `<span class="g-meta">${esc(meta)}</span>` : ""}</span>
      <span class="g-time">${hhmm(s.startTime)}</span>
    </button>`;
      }

      function selectedHtml(g) {
        const s = summary();
        if (!s) return "";
        const races = g?.races ?? [];
        const tracks = g
          ? [...new Set(races.map((r) => r.trackName))]
          : s.tracks;
        const allDone = races.length > 0 && races.every(started);
        const starters = races.reduce((n, r) => n + r.runners.length, 0);
        const valueCount = races.filter(
          (r) => !started(r) && (bestValue(r)?.value ?? 0) >= GOOD_VALUE,
        ).length;
        const meta = g
          ? `${plural(races.length, "avdelning", "avdelningar")} · ${starters} startande`
          : "Räknar fram ranking …";
        const mobileMeta = g
          ? `${plural(races.length, "avdelning", "avdelningar")} · ${tracks.join(" + ")}`
          : tracks.join(" + ");
        return `<section class="card sel" aria-label="Valt spel">
      <div class="sel-id">
        <span class="big">${esc(g?.gameType ?? s.type)}</span>
        <div>
          <span class="s-tracks d-only">${esc(tracks.join(" + "))}</span>
          <span class="s-meta d-only">${esc(meta)}</span>
          <span class="s-tracks m-only">${esc(mobileMeta)}</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">${allDone ? "Avgjort" : "Första start"}</span><span class="v">${hhmm(races[0]?.startTime ?? s.startTime)}</span></div>
        <div class="stat d-only"><span class="label">Värdespel</span><span class="v blue">${g && !allDone ? valueCount : "–"}</span></div>
      </div>
    </section>`;
      }

      function tracksHtml(g) {
        if (state.error && !g) return emptyHtml(state.error.title, state.error.text);
        if (!g) return '<div class="skeleton"></div>';
        if (!g.races.length)
          return emptyHtml("Inga travlopp i spelet", "Välj ett annat spel.");
        const groups = new Map();
        g.races.forEach((race, i) => {
          if (!groups.has(race.trackName)) groups.set(race.trackName, []);
          groups.get(race.trackName).push({ race, i });
        });
        return [...groups]
          .map(([name, list]) => {
            const done = list.every((x) => started(x.race));
            const first = hhmm(list[0].race.startTime);
            const last = hhmm(list[list.length - 1].race.startTime);
            const span = first && last ? ` · ${first}–${last}` : "";
            return `<section class="card track">
        <div class="track-head">
          <div class="t-title"><h2>${esc(name)}</h2><span class="t-sum">${plural(list.length, "avdelning", "avdelningar")}${span}</span></div>
          <span class="status-pill${done ? " done" : ""}">${done ? "Avgjord" : "Öppen"}</span>
        </div>
        <div class="legs"><div class="legs-inner">
          <div class="leg-head label d-only" aria-hidden="true"><span>Avd</span><span>Lopp</span><span>Tid</span><span>Distans · start</span><span style="text-align:right">Startande</span><span>Högst rankad</span><span>Bästa värde</span><span></span></div>
          ${list.map(({ race, i }) => legRowHtml(g, race, i)).join("")}
        </div></div>
      </section>`;
          })
          .join("");
      }

      function legRowHtml(g, race, i) {
        const top = race.runners[0];
        const best = bestValue(race);
        const meta = [
          race.distance ? `${race.distance} m` : "",
          startMethod(race.startMethod),
          race.sport === "monte" ? "Monté" : "",
        ]
          .filter(Boolean)
          .join(" · ");
        const showBest = best && best.value > 1;
        return `<a href="${urlFor(i + 1)}" data-leg="${i + 1}" class="leg-row${started(race) ? " past" : ""}">
      <span class="leg">${esc(legLabel(g, i))}</span>
      <span class="r-main">
        <span class="r-line"><span class="r-time">${hhmm(race.startTime)}</span><span class="r-no"><span class="m-only">Lopp </span><span class="d-only">R</span>${race.number}</span></span>
        <span class="r-meta">${esc(meta)}<span class="m-only"> · ${race.runners.length} startande</span></span>
      </span>
      <span class="r-starters d-only">${race.runners.length}</span>
      <span class="r-pick"><span class="label m-only">Högst rankad</span><span class="r-pickname">${top ? esc(top.horseName) : "–"}</span>${top ? `<span class="r-note d-only">${winPct(top.winProbability)} vinst</span>` : ""}</span>
      <span class="r-val d-only">${showBest ? `<span class="r-valname">${esc(best.horseName)}</span>${valueBadge(best.value)}` : '<span class="r-valname" style="color:var(--muted)">–</span>'}</span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>`;
      }

      function renderRace(g) {
        const i = state.leg - 1;
        const race = g.races[i];
        const leg = legLabel(g, i);
        const monte = race.sport === "monte";
        const chips = [
          race.distance ? `${race.distance} m` : "",
          startMethod(race.startMethod),
          plural(race.runners.length, "startande", "startande"),
          monte ? "Monté" : "",
        ]
          .filter(Boolean)
          .map((c) => `<span class="chip">${esc(c)}</span>`)
          .join("");
        const lists = [
          race.topList === "stl"
            ? '<span class="chip" title="Kusk- och tränarbonus kommer från topplistorna för STL-lopp">STL-topplista</span>'
            : "",
          race.monteList
            ? '<span class="chip" title="Ryttarbonus kommer från Travsports topplista för montélopp">Montétopplista</span>'
            : "",
        ].join("");

        const tabs = g.races
          .map((r, j) => {
            const on = j === i;
            return `<a href="${urlFor(j + 1)}" data-leg="${j + 1}" class="race-tab${started(r) ? " past" : ""}"${on ? ' aria-current="page"' : ""} aria-label="Lopp ${r.number}, ${esc(r.trackName)}, ${hhmm(r.startTime)}, ${esc(legLabel(g, j))}">
        <span class="t-no">${esc(g.gameType)}:${j + 1}</span><span class="t-sub d-only">${hhmm(r.startTime)} · Lopp ${r.number}</span>
      </a>`;
          })
          .join("");

        const runners = race.runners.slice().sort((a, b) =>
          state.sort === "value"
            ? (b.value ?? -1) - (a.value ?? -1) || a.rank - b.rank
            : state.sort === "number"
              ? a.number - b.number
              : a.rank - b.rank,
        );
        const sorts = SORTS.map(
          ([id, label]) =>
            `<button type="button" data-sort="${id}" aria-pressed="${state.sort === id}">${label}</button>`,
        ).join("");
        const best = race.runners
          .filter((r) => r.value != null)
          .sort((a, b) => b.value - a.value)
          .slice(0, 3);
        const person = monte ? "ryttare" : "kusk";

        els.view.innerHTML = `<div class="wrap page race-page">
    <nav aria-label="Brödsmulor" class="crumbs d-only">
      <a href="${urlFor(null)}" data-nav="today">Dagens spel</a><span aria-hidden="true">/</span>
      <span>${esc(g.gameType)} · ${esc(race.trackName)}</span><span aria-hidden="true">/</span>
      <span class="here">Lopp ${race.number}</span>
    </nav>
    <a href="${urlFor(null)}" data-nav="today" class="back m-only">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      Dagens spel
    </a>

    <div class="race-head">
      <div class="rh-left">
        <div class="rh-tag"><span class="badge-leg">${esc(leg)}</span><span>${esc(race.trackName)}</span></div>
        <h1>Lopp ${race.number}</h1>
        <div class="chips d-only">${chips}${lists}</div>
      </div>
      <div class="rh-right">
        <span class="rh-time">${hhmm(race.startTime)}</span>
        <span class="rh-count" id="countdown">${esc(countdown(race))}</span>
      </div>
      <div class="chips m-only">${chips}${lists}</div>
    </div>

    <nav aria-label="Lopp i spelet" class="race-tabs">${tabs}</nav>

    <div class="race-body">
      <section class="card ranking" aria-labelledby="ranking-h">
        <div class="ranking-head">
          <h2 id="ranking-h">Ranking</h2>
          <div class="sort">
            <span class="label" id="sort-label">Sortera efter</span>
            <div class="seg" role="group" aria-labelledby="sort-label">${sorts}</div>
          </div>
        </div>
        <div class="table-box">
          <table class="runners">
            <thead><tr>
              <th scope="col" class="c-rank center"><span class="d-only">Rank</span><span class="m-only">#</span></th>
              <th scope="col" class="c-nr center d-only">Nr</th>
              <th scope="col"><span class="d-only">Häst · ${person}</span><span class="m-only">Häst</span></th>
              <th scope="col" class="c-pts">Poäng</th>
              <th scope="col" class="c-win right" title="Modellens chans att hästen vinner"><span class="d-only">Vinst %</span><span class="m-only">Vinst</span></th>
              <th scope="col" class="right d-only">Odds</th>
              <th scope="col" class="c-val right" title="Modellens vinstchans jämfört med marknadens">Värde</th>
            </tr></thead>
            <tbody>${runners.map((r) => runnerHtml(race, r)).join("")}</tbody>
          </table>
          ${race.scratched.length ? `<p class="scratched">Strukna: ${race.scratched.join(", ")}</p>` : ""}
        </div>
      </section>

      <aside class="side">
        <section class="card" aria-labelledby="best-h">
          <h2 id="best-h">Bästa värde</h2>
          ${
            best.length
              ? best
                  .map(
                    (b) => `<div class="best">
            <span class="nr">${b.number}</span>
            <span class="b-text"><span class="b-name">${esc(b.horseName)}</span><span class="b-meta">${winPct(b.winProbability)} vinst · odds ${b.odds ? nf(b.odds, 2) : "–"}</span></span>
            ${valueBadge(b.value)}
          </div>`,
                  )
                  .join("")
              : "<p>Odds saknas ännu, så värdet kan inte räknas.</p>"
          }
        </section>
        <section class="card">
          <h2>Så läser du tabellen</h2>
          <p><strong>Poäng</strong> är hästens samlade rankingpoäng (0–100). <strong>Vinst %</strong> är modellens chans att hästen vinner. Tryck på en häst för att se delpoängen.</p>
          <p><strong>Värde</strong> jämför modellens vinstchans med marknadens (oddsen). Positivt betyder att modellen tror mer på hästen än spelarna gör; en fylld etikett markerar +${valuePct(GOOD_VALUE)}% eller mer.</p>
        </section>
      </aside>
    </div>
  </div>`;

        if (state.highlight != null) {
          const row = els.view.querySelector(
            `tr.runner[data-nr="${state.highlight}"]`,
          );
          state.highlight = null;
          if (row) {
            row.scrollIntoView({ block: "center" });
            row.classList.add("flash");
          }
        }
      }

      function runnerHtml(race, r) {
        const key = `${race.raceId}-${r.number}`;
        const id = `d-${r.number}`;
        const open = state.open.has(key);
        const low = r.confidence < LOW_CONFIDENCE;
        const strong = r.value != null && r.value >= GOOD_VALUE;
        const rankCls = r.rank === 1 ? " r1" : r.rank <= 3 ? " r2" : "";
        const tags = [
          ...r.notes.map((n) => `<span class="tag">${esc(n)}</span>`),
          low ? '<span class="tag plain">Lite data</span>' : "",
        ].join("");
        const factors = FACTORS.filter(([k]) => r.factors[k]?.weight > 0)
          .map(([k, name]) => {
            const label =
              race.sport === "monte" && k === "driver" ? "Ryttare" : name;
            const f = r.factors[k];
            const missing = f.raw === null;
            return `<div class="factor${missing ? " missing" : ""}"><span>${label}</span>
        <span class="bar"><span style="width:${missing ? 0 : f.score}%"></span></span>
        <span class="num">${missing ? "–" : Math.round(f.score)}</span></div>`;
          })
          .join("");
        const odds = r.odds ? nf(r.odds, 2) : "–";

        return `<tr class="runner${strong ? " strong" : ""}${low ? " low" : ""}" data-nr="${r.number}">
      <td class="c-rank center"><span class="rank${rankCls}">${r.rank}</span></td>
      <td class="c-nr center d-only"><span class="nr">${r.number}</span></td>
      <td><div class="horse-cell">
        <span class="nr m-only" aria-label="Startnummer ${r.number}">${r.number}</span>
        <button type="button" class="toggle" aria-expanded="${open}" aria-controls="${id}" data-key="${esc(key)}">
          <span class="h-name">${esc(r.horseName)}</span><span class="h-driver">${esc(r.driverName)}</span>
        </button>
      </div></td>
      <td class="c-pts"><div class="pts"><span class="pts-n">${nf(r.points, 1)}</span><span class="bar"><span style="width:${Math.max(0, Math.min(100, r.points))}%"></span></span></div></td>
      <td class="c-win right num">${winPct(r.winProbability)}</td>
      <td class="c-odds right num d-only">${odds}</td>
      <td class="c-val right">${valueBadge(r.value)}<span class="odds-inline m-only">odds ${odds}</span></td>
    </tr>
    <tr class="detail" id="${id}"${open ? "" : " hidden"}><td colspan="7">
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      <div class="factors">${factors}</div>
      <p class="detail-meta">Tränare ${esc(r.trainerName)}. Data finns för ${Math.round(r.confidence * 100)} % av poängen; saknade delar räknas som medel.</p>
    </td></tr>`;
      }

      /* ---------- Sök ---------- */
      function closeResults() {
        els.results.hidden = true;
        els.results.innerHTML = "";
      }
      function search() {
        const term = els.q.value.trim().toLocaleLowerCase("sv-SE");
        if (!term) return closeResults();
        const g = game();
        if (!g) {
          els.results.innerHTML =
            '<li class="empty-hit">Välj ett spel först – sökningen gäller spelets startlistor.</li>';
          els.results.hidden = false;
          return;
        }
        const hits = g.races
          .flatMap((race, i) =>
            race.runners.map((r) => ({ race, i, r })),
          )
          .filter(
            ({ r }) =>
              r.horseName.toLocaleLowerCase("sv-SE").includes(term) ||
              r.driverName.toLocaleLowerCase("sv-SE").includes(term),
          )
          .slice(0, 10);
        els.results.innerHTML = hits.length
          ? hits
              .map(
                ({ race, i, r }) => `<li><button type="button" data-leg="${i + 1}" data-nr="${r.number}">
          <span class="nr">${r.number}</span>
          <span><span class="rs-name">${esc(r.horseName)}</span><br><span class="rs-meta">${esc(legLabel(g, i))} · ${esc(race.trackName)} lopp ${race.number} · ${esc(r.driverName)} · rank ${r.rank}</span></span>
        </button></li>`,
              )
              .join("")
          : '<li class="empty-hit">Ingen häst eller kusk matchar i det här spelet.</li>';
        els.results.hidden = false;
      }
      els.q.addEventListener("input", search);
      els.q.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          els.q.value = "";
          closeResults();
        }
        if (e.key === "ArrowDown") {
          e.preventDefault();
          els.results.querySelector("button")?.focus();
        }
      });
      els.results.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-leg]");
        if (!b) return;
        state.highlight = Number(b.dataset.nr);
        state.sort = "points";
        els.q.value = "";
        go(Number(b.dataset.leg));
      });
      document.addEventListener("click", (e) => {
        if (!els.search.contains(e.target)) closeResults();
      });
      els.searchToggle.addEventListener("click", () => {
        const show = els.search.hidden;
        els.search.hidden = !show;
        els.searchToggle.setAttribute("aria-expanded", String(show));
        if (show) els.q.focus();
      });
      const mobile = matchMedia("(max-width: 820px)");
      const syncSearch = () => {
        els.search.hidden = mobile.matches;
        els.searchToggle.setAttribute("aria-expanded", "false");
      };
      mobile.addEventListener("change", syncSearch);
      syncSearch();

      /* ---------- Interaktion ---------- */
      document.addEventListener("click", (e) => {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey)
          return;
        const nav = e.target.closest("a[data-nav], a[data-leg]");
        if (nav) {
          e.preventDefault();
          return go(nav.dataset.leg ? Number(nav.dataset.leg) : null);
        }
        const gameBtn = e.target.closest("button[data-game]");
        if (gameBtn) {
          if (gameBtn.dataset.game === state.gameId) return;
          state.gameId = gameBtn.dataset.game;
          state.leg = null;
          history.pushState(null, "", urlFor(null));
          loadRanking(false);
          return refocus(`[data-game="${CSS.escape(state.gameId)}"]`);
        }
        const sortBtn = e.target.closest("button[data-sort]");
        if (sortBtn) {
          state.sort = sortBtn.dataset.sort;
          render();
          return refocus(`[data-sort="${state.sort}"]`);
        }
        const toggle = e.target.closest(".toggle");
        if (toggle) {
          const open = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!open));
          $(toggle.getAttribute("aria-controls")).hidden = open;
          if (open) state.open.delete(toggle.dataset.key);
          else state.open.add(toggle.dataset.key);
        }
      });

      /* Vyn byggs om vid varje rendering – behåll fokus på knappen. */
      const refocus = (sel) => els.view.querySelector(sel)?.focus();

      addEventListener("popstate", () => {
        const p = new URLSearchParams(location.search);
        const date = p.get("date");
        const leg = Number(p.get("lopp")) || null;
        if (date && date !== state.date) {
          state.date = date;
          els.date.value = date;
          state.rankings.clear();
          state.leg = leg;
          return loadGames(p.get("game"));
        }
        state.leg = leg;
        const gameId = p.get("game");
        if (gameId && gameId !== state.gameId) {
          state.gameId = gameId;
          if (!state.rankings.has(gameId)) return loadRanking(false);
        }
        render();
      });

      els.date.addEventListener("change", () => {
        if (!els.date.value) return;
        state.date = els.date.value;
        state.rankings.clear();
        state.leg = null;
        history.pushState(null, "", urlFor(null));
        loadGames(null);
      });
      els.refresh.addEventListener("click", () =>
        state.gameId ? loadRanking(true) : loadGames(null),
      );
      /* PDF: hämtas som fil så att vi kan visa förlopp och fel i statusraden,
         och visas sedan i en förhandsvisning med knappar för att spara. */
      const preview = {
        dialog: $("preview"),
        title: $("preview-title"),
        frame: $("preview-frame"),
        fallback: $("preview-fallback"),
        open: $("preview-open"),
        download: $("preview-download"),
        url: null,
      };
      function showPreview(blob, name, title) {
        if (preview.url) URL.revokeObjectURL(preview.url);
        preview.url = URL.createObjectURL(blob);
        preview.title.textContent = title;
        preview.open.href = preview.url;
        preview.download.href = preview.url;
        preview.download.download = name;
        // Mobilwebbläsare saknar ofta inbyggd PDF-visare; visa då bara knapparna.
        const inline = navigator.pdfViewerEnabled !== false;
        preview.frame.hidden = !inline;
        preview.fallback.hidden = inline;
        preview.frame.src = inline ? `${preview.url}#view=FitH` : "about:blank";
        preview.dialog.showModal();
      }
      preview.dialog.addEventListener("close", () => {
        preview.frame.src = "about:blank";
        if (preview.url) URL.revokeObjectURL(preview.url);
        preview.url = null;
        els.exportPdf.focus();
      });
      $("preview-close").addEventListener("click", () =>
        preview.dialog.close(),
      );
      preview.dialog.addEventListener("click", (e) => {
        if (e.target === preview.dialog) preview.dialog.close();
      });

      els.exportPdf.addEventListener("click", async () => {
        if (!state.gameId) return;
        els.exportPdf.disabled = true;
        setStatus("Skapar PDF …");
        try {
          const res = await fetch(
            `/api/export.pdf?date=${state.date}&game=${encodeURIComponent(state.gameId)}`,
          );
          if (!res.ok)
            throw new Error(
              (await res.json().catch(() => ({}))).error ||
                `HTTP ${res.status}`,
            );
          const blob = await res.blob();
          const name =
            /filename="([^"]+)"/.exec(
              res.headers.get("content-disposition") || "",
            )?.[1] || "travranking.pdf";
          const g = game();
          showPreview(
            blob,
            name,
            `${g?.gameType ?? "PDF"} · ${longDate(state.date)}`,
          );
          setStatus("");
        } catch (err) {
          setStatus(`Kunde inte skapa PDF: ${err.message}`, true);
        } finally {
          els.exportPdf.disabled = false;
        }
      });

      /* Nedräkningen och "avgjord"-status följer klockan. */
      setInterval(() => {
        const g = game();
        const el = $("countdown");
        if (el && g && state.leg) el.textContent = countdown(g.races[state.leg - 1]);
      }, 30_000);

      /* ---------- Start ---------- */
      const params = new URLSearchParams(location.search);
      state.date = /^\d{4}-\d{2}-\d{2}$/.test(params.get("date") || "")
        ? params.get("date")
        : todayStockholm();
      state.leg = Number(params.get("lopp")) || null;
      els.date.value = state.date;
      loadGames(params.get("game"));
    </script>
  </body>
</html>
